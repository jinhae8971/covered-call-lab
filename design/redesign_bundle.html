document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

acc);text-decoration:none}\na:hover{color:var(--acc2)}\nbutton{font-family:inherit;font-variant-numeric:tabular-nums}\ninput{font-family:inherit;font-variant-numeric:tabular-nums}\n::-webkit-scrollbar{width:11px;height:11px}\n::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:3px solid transparent;background-clip:content-box}\n::-webkit-scrollbar-track{background:transparent}\n@keyframes ccl-pulse{0%,100%{opacity:1}50%{opacity:.55}}\n<\u002Fstyle>\n<script src=\"7f346127-e67e-4eb2-bb86-756b2a822d79\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"display:flex;align-items:stretch;min-height:100vh;background:var(--bg)\">\n\n  <aside style=\"width:246px;flex:0 0 246px;position:sticky;top:0;align-self:flex-start;height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--side1),var(--side2));border-right:1px solid var(--line);padding:22px 16px 16px\">\n    <div style=\"display:flex;align-items:center;gap:11px;padding:0 6px 20px\">\n      <div style=\"width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;letter-spacing:-.4px\">FL<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n        <div style=\"font-size:14.5px;font-weight:700;letter-spacing:-.2px\">경제적자유 랩<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--tx3);letter-spacing:.1px\">총수익률 우선 리서치<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <nav style=\"display:flex;flex-direction:column;gap:3px\">\n      <button sc-camel-on-click=\"{{ goResearch }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:9px 11px;border:0;border-radius:var(--r2);font-size:13.5px;font-weight:600;cursor:pointer;{{ tabResearchSx }}\">\n        <span>ETF 분석<\u002Fspan>\n        <span style=\"font-size:11px;font-weight:600;opacity:.62\">{{ ccCount }}종<\u002Fspan>\n      <\u002Fbutton>\n      <div hidden=\"{{ hideResearchSub }}\" style=\"display:flex;flex-direction:column;gap:1px;padding:4px 0 8px 11px;margin-left:5px;border-left:1px solid var(--line)\">\n        <a href=\"#s-gen\" style=\"padding:5px 10px;font-size:12.5px;color:var(--tx2);border-radius:var(--r3)\" style-hover=\"background:var(--surface2);color:var(--tx)\">세대별 계보<\u002Fa>\n        <a href=\"#s-tbl\" style=\"padding:5px 10px;font-size:12.5px;color:var(--tx2);border-radius:var(--r3)\" style-hover=\"background:var(--surface2);color:var(--tx)\">종목 비교<\u002Fa>\n        <a href=\"#s-chart\" style=\"padding:5px 10px;font-size:12.5px;color:var(--tx2);border-radius:var(--r3)\" style-hover=\"background:var(--surface2);color:var(--tx)\">구조 차트<\u002Fa>\n        <a href=\"#s-ins\" style=\"padding:5px 10px;font-size:12.5px;color:var(--tx2);border-radius:var(--r3)\" style-hover=\"background:var(--surface2);color:var(--tx)\">결론<\u002Fa>\n        <a href=\"#s-tax\" style=\"padding:5px 10px;font-size:12.5px;color:var(--tx2);border-radius:var(--r3)\" style-hover=\"background:var(--surface2);color:var(--tx)\">세금 구조<\u002Fa>\n      <\u002Fdiv>\n\n      <button sc-camel-on-click=\"{{ goPortfolio }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:9px 11px;border:0;border-radius:var(--r2);font-size:13.5px;font-weight:600;cursor:pointer;{{ tabPortfolioSx }}\">\n        <span>내 포트폴리오<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;{{ sideAlertSx }}\">{{ sideAlertTxt }}<\u002Fspan>\n      <\u002Fbutton>\n      <div hidden=\"{{ hidePortfolioSub }}\" style=\"display:flex;flex-direction:column;gap:1px;padding:4px 0 8px 11px;margin-left:5px;border-left:1px solid var(--line)\">\n        <a href=\"#s-month\" style=\"padding:5px 10px;font-size:12.5px;color:var(--tx2);border-radius:var(--r3)\" style-hover=\"background:var(--surface2);color:var(--tx)\">이번 달 분배금<\u002Fa>\n        <a href=\"#s-div\" style=\"padding:5px 10px;font-size:12.5px;color:var(--tx2);border-radius:var(--r3)\" style-hover=\"background:var(--surface2);color:var(--tx)\">분배금 추세<\u002Fa>\n        <a href=\"#s-hold\" style=\"padding:5px 10px;font-size:12.5px;color:var(--tx2);border-radius:var(--r3)\" style-hover=\"background:var(--surface2);color:var(--tx)\">보유 현황<\u002Fa>\n        <a href=\"#s-trend\" style=\"padding:5px 10px;font-size:12.5px;color:var(--tx2);border-radius:var(--r3)\" style-hover=\"background:var(--surface2);color:var(--tx)\">수익 추이<\u002Fa>\n        <a href=\"#s-nav\" style=\"padding:5px 10px;font-size:12.5px;color:var(--tx2);border-radius:var(--r3)\" style-hover=\"background:var(--surface2);color:var(--tx)\">NAV 추이<\u002Fa>\n        <a href=\"#s-alloc\" style=\"padding:5px 10px;font-size:12.5px;color:var(--tx2);border-radius:var(--r3)\" style-hover=\"background:var(--surface2);color:var(--tx)\">현재 비중<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fnav>\n\n    <div style=\"flex:1 1 auto\"><\u002Fdiv>\n\n    <button id=\"thbtn\" sc-camel-on-click=\"{{ toggleTheme }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:9px 11px;margin-bottom:14px;background:transparent;color:var(--tx2);border:1px solid var(--line);border-radius:var(--r2);font-size:12.5px;font-weight:600;cursor:pointer;text-align:left\" style-hover=\"border-color:var(--line2);color:var(--tx)\">\n      <span>{{ themeLabel }}<\u002Fspan>\n      <span style=\"font-size:11px;color:var(--tx3)\">{{ themeHint }}<\u002Fspan>\n    <\u002Fbutton>\n\n    <div style=\"display:flex;flex-direction:column;gap:7px;padding:14px 11px 4px;border-top:1px solid var(--line)\">\n      <div style=\"display:flex;justify-content:space-between;gap:8px;font-size:11.5px\"><span style=\"color:var(--tx3)\">갱신<\u002Fspan><span id=\"gen\" style=\"color:var(--tx2);font-weight:600\">2026-08-17 06:07<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:8px;font-size:11.5px\"><span style=\"color:var(--tx3)\">수록 종목<\u002Fspan><span id=\"cnt\" style=\"color:var(--tx2);font-weight:600\">{{ cntTxt }}<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:8px;font-size:11.5px\"><span style=\"color:var(--tx3)\">USD/KRW<\u002Fspan><span id=\"fxm\" style=\"color:var(--tx2);font-weight:600\">1,415.7<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main style=\"flex:1 1 auto;min-width:0;padding:30px 32px 60px;max-width:1420px\">\n\n    <section id=\"pane-research\" data-screen-label=\"분석\" hidden=\"{{ hideResearch }}\">\n      <header style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:22px\">\n        <div style=\"max-width:720px\">\n          <div style=\"font-size:11.5px;font-weight:700;letter-spacing:1.3px;color:var(--tx3);padding-bottom:8px\">ETF 분석<\u002Fdiv>\n          <h1 style=\"margin:0;font-size:29px;line-height:1.24;font-weight:750;letter-spacing:-.7px;text-wrap:pretty\">분배율이 아니라 총수익률.<br>절대수익이 아니라 원지수 대비 초과수익.<\u002Fh1>\n          <p style=\"margin:11px 0 0;font-size:13.5px;line-height:1.62;color:var(--tx2);max-width:640px;text-wrap:pretty\">커버드콜 ETF는 분배율만 보면 반드시 틀립니다. 연 12%를 받으면서 주가가 15% 깎이면 원금을 나눠 받으며 세금까지 내는 것입니다. 이 화면의 모든 정렬 기준은 총수익과 초과수익입니다.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fheader>\n\n      <div id=\"kpis\" style=\"display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-bottom:26px\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px\">\n          <div style=\"background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px 18px;position:relative;overflow:hidden\">\n            <div style=\"display:flex;align-items:center;gap:8px;padding-bottom:10px\">\n              <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.6px;color:var(--tx2)\">평균 초과수익 1년<\u002Fspan>\n              <span style=\"font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--onacc);background:var(--acc);padding:2px 6px;border-radius:4px\">1순위<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:10px\">\n              <div style=\"font-size:46px;line-height:1;font-weight:760;letter-spacing:-2px;{{ kExSx }}\">{{ kEx }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:var(--tx3);font-weight:600\">%p<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12px;line-height:1.55;color:var(--tx2);padding-top:11px;max-width:340px\">커버드콜 {{ ccCount }}종 평균이 각자의 원지수를 이만큼 밑돌았습니다. 이 값이 0을 넘지 못하면 원지수를 그냥 사는 것이 낫습니다.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px 18px\">\n            <div style=\"display:flex;align-items:center;gap:8px;padding-bottom:10px\">\n              <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.6px;color:var(--tx2)\">평균 총수익 1년<\u002Fspan>\n              <span style=\"font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--tx2);border:1px solid var(--line2);padding:2px 6px;border-radius:4px\">2순위<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:10px\">\n              <div style=\"font-size:46px;line-height:1;font-weight:760;letter-spacing:-2px;{{ kTrSx }}\">{{ kTr }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:var(--tx3);font-weight:600\">%<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12px;line-height:1.55;color:var(--tx2);padding-top:11px;max-width:340px\">분배금을 재투자했다고 가정한 실제 수익. 통장에 들어온 금액이 아니라 자산이 실제로 늘어난 몫입니다.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:12px;padding:2px 2px 0\">\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:1px;color:var(--tx3)\">참고 지표<\u002Fspan>\n          <span style=\"flex:1 1 auto;height:1px;background:var(--line)\"><\u002Fspan>\n          <span style=\"font-size:11px;color:var(--tx3)\">지수·채권·원자재·레버리지는 평균에서 제외<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px\">\n          <div style=\"border:1px solid var(--line);border-radius:var(--r2);padding:13px 14px\">\n            <div style=\"font-size:11px;color:var(--tx3);padding-bottom:6px\">평균 분배율 TTM<\u002Fdiv>\n            <div style=\"font-size:20px;font-weight:700;letter-spacing:-.5px;color:var(--tx2)\">{{ kY }}%<\u002Fdiv>\n            <div style=\"font-size:10.5px;color:var(--tx3);padding-top:5px\">순위 근거로 쓰지 않음<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--line);border-radius:var(--r2);padding:13px 14px\">\n            <div style=\"font-size:11px;color:var(--tx3);padding-bottom:6px\">평균 상승참여율<\u002Fdiv>\n            <div style=\"font-size:20px;font-weight:700;letter-spacing:-.5px\">{{ kCap }}%<\u002Fdiv>\n            <div style=\"font-size:10.5px;color:var(--tx3);padding-top:5px\">원지수 상승분 중 따라간 비율<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--line);border-radius:var(--r2);padding:13px 14px\">\n            <div style=\"font-size:11px;color:var(--tx3);padding-bottom:6px\">평균 낙폭방어폭<\u002Fdiv>\n            <div style=\"font-size:20px;font-weight:700;letter-spacing:-.5px\">{{ kEdge }}%p<\u002Fdiv>\n            <div style=\"font-size:10.5px;color:var(--tx3);padding-top:5px\">원지수 MDD 대비 덜 빠진 폭<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--line);border-radius:var(--r2);padding:13px 14px\">\n            <div style=\"font-size:11px;color:var(--tx3);padding-bottom:6px\">평균 상장후 주가<\u002Fdiv>\n            <div style=\"font-size:20px;font-weight:700;letter-spacing:-.5px;{{ kPxSx }}\">{{ kPx }}%<\u002Fdiv> 2Fbutton>\n          <div hidden=\"{{ methodClosed }}\" style=\"padding:2px 24px 22px\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px 26px\">\n              <div style=\"padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2)\">\n                <div style=\"font-size:12px;font-weight:700;padding-bottom:6px\">종합점수 = 백분위 가중합<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:5px;padding-top:4px\">\n                  <div style=\"display:flex;align-items:center;gap:9px;font-size:11.5px\"><span style=\"width:96px;color:var(--tx2)\">초과수익 1Y<\u002Fspan><span style=\"flex:1 1 auto;height:5px;border-radius:3px;background:var(--surface3);overflow:hidden\"><span style=\"display:block;height:5px;background:var(--acc);width:100%\"><\u002Fspan><\u002Fspan><span style=\"width:30px;text-align:right;font-weight:700\">40%<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:9px;font-size:11.5px\"><span style=\"width:96px;color:var(--tx2)\">낙폭방어폭<\u002Fspan><span style=\"flex:1 1 auto;height:5px;border-radius:3px;background:var(--surface3);overflow:hidden\"><span style=\"display:block;height:5px;background:var(--acc);width:50%\"><\u002Fspan><\u002Fspan><span style=\"width:30px;text-align:right;font-weight:700\">20%<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:9px;font-size:11.5px\"><span style=\"width:96px;color:var(--tx2)\">총수익 1Y<\u002Fspan><span style=\"flex:1 1 auto;height:5px;border-radius:3px;background:var(--surface3);overflow:hidden\"><span style=\"display:block;height:5px;background:var(--acc);width:37.5%\"><\u002Fspan><\u002Fspan><span style=\"width:30px;text-align:right;font-weight:700\">15%<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:9px;font-size:11.5px\"><span style=\"width:96px;color:var(--tx3)\">분배율 TTM<\u002Fspan><span style=\"flex:1 1 auto;height:5px;border-radius:3px;background:var(--surface3);overflow:hidden\"><span style=\"display:block;height:5px;background:var(--tx3);width:37.5%\"><\u002Fspan><\u002Fspan><span style=\"width:30px;text-align:right;font-weight:700;color:var(--tx2)\">15%<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:9px;font-size:11.5px\"><span style=\"width:96px;color:var(--tx3)\">저보수<\u002Fspan><span style=\"flex:1 1 auto;height:5px;border-radius:3px;background:var(--surface3);overflow:hidden\"><span style=\"display:block;height:5px;background:var(--tx3);width:25%\"><\u002Fspan><\u002Fspan><span style=\"width:30px;text-align:right;font-weight:700;color:var(--tx2)\">10%<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:11px;color:var(--tx3);padding-top:10px;line-height:1.55\">커버드콜(G1~G4) 안에서만 백분위를 계산합니다. 지수·채권·원자재·레버리지는 공란입니다.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <div style=\"padding:12px 15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2)\">\n                  <div style=\"font-size:12px;font-weight:700;padding-bottom:5px\">초과수익을 쓰는 이유<\u002Fdiv>\n                  <div style=\"font-size:11.5px;line-height:1.62;color:var(--tx2);text-wrap:pretty\">커버드콜은 원지수를 대체하려는 상품입니다. 절대 총수익이 높아도 원지수를 밑돌면 원지수를 그냥 사는 편이 낫습니다. 그래서 순위의 40%를 원지수 대비 차이에 둡니다.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:12px 15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2)\">\n                  <div style=\"font-size:12px;font-weight:700;padding-bottom:5px\">참여율 · 방어폭 · NAV 침식<\u002Fdiv>\n                  <div style=\"font-size:11.5px;line-height:1.62;color:var(--tx2);text-wrap:pretty\">상승참여율은 원지수가 오른 구간에서 따라간 비율, 낙폭방어폭은 원지수 MDD보다 덜 빠진 폭입니다. NAV 침식은 직접 공시값이 없어 <strong style=\"font-weight:700;color:var(--tx)\">상장 후 주가 변화<\u002Fstrong>를 대용치로 씁니다.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:10px;padding:12px 15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2)\">\n                  <span style=\"font-size:15px;font-weight:700;color:var(--warn);line-height:1.2\">≈<\u002Fspan>\n                  <div>\n                    <div style=\"font-size:12px;font-weight:700;padding-bottom:5px\">데이터 출처와 ≈ 마커<\u002Fdiv>\n                    <div style=\"font-size:11.5px;line-height:1.62;color:var(--tx2);text-wrap:pretty\">미국은 Yahoo Finance 배당재투자 조정종가와 실제 분배기준일. 한국은 금액은 네이버 금융, 날짜는 Yahoo <code style=\"font-size:11px;background:var(--surface3);padding:1px 4px;border-radius:3px\">.KS<\u002Fcode> 이력(46종 중 42종). 두 출처가 25% 넘게 어긋나면 관행 규칙으로 되돌리고 <strong style=\"font-weight:700;color:var(--warn)\">≈<\u002Fstrong>를 붙입니다.<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"s-chart\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px;margin-bottom:16px\">\n        <div style=\"background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px\">\n          <h3 style=\"margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.25px\">분배율 vs 총수익률<\u002Fh3>\n          <p id=\"n1\" style=\"margin:6px 0 14px;font-size:12px;line-height:1.55;color:var(--tx2);text-wrap:pretty\">오른쪽으로 갈수록 분배율이 높습니다. 점들이 우상향하지 않으면 <strong style=\"font-weight:700;color:var(--tx)\">고배당이 고수익이라는 말은 거짓<\u002Fstrong>입니다.<\u002Fp>\n          <div style=\"position:relative;height:296px\"><canvas id=\"c1\"><\u002Fcanvas><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px\">\n          <h3 style=\"margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.25px\">상승참여율 vs 낙폭방어폭<\u002Fh3>\n          <p style=\"margin:6px 0 14px;font-size:12px;line-height:1.55;color:var(--tx2);text-wrap:pretty\">오른쪽 위가 잘 설계된 상품, 왼쪽 아래가 최악의 조합입니다. 사분면 배경으로 구획을 표시했습니다.<\u002Fp>\n          <div style=\"position:relative;height:296px\"><canvas id=\"c2\"><\u002Fcanvas><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--line);border-radius:var(--r);padding:18px 20px\">\n          <h3 style=\"margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.2px\">NAV 침식 — 상장 후 주가 변화<\u002Fh3>\n          <p style=\"margin:6px 0 12px;font-size:11.5px;color:var(--tx2)\">왼쪽(음수)으로 길수록 원금을 나눠 주고 있는 중<\u002Fp>\n          <div style=\"position:relative;height:330px\"><canvas id=\"c3\"><\u002Fcanvas><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--line);border-radius:var(--r);padding:18px 20px\">\n          <h3 style=\"margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.2px\">세대별 평균 지표<\u002Fh3>\n          <p style=\"margin:6px 0 12px;font-size:11.5px;color:var(--tx2)\">분배율은 3세대에서 정점, 초과수익은 4세대에서 회복<\u002Fp>\n          <div style=\"position:relative;height:330px\"><canvas id=\"c4\"><\u002Fcanvas><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"s-ins\" style=\"background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px 24px;margin-bottom:16px\">\n        <h2 style=\"margin:0;font-size:18px;font-weight:700;letter-spacing:-.35px\">총수익률 우선 관점의 결론<\u002Fh2>\n        <p style=\"margin:6px 0 18px;font-size:12.5px;color:var(--tx2)\">아래 문장은 매 갱신마다 데이터에서 다시 생성됩니다<\u002Fp>\n        <div id=\"insights\" style=\"display:flex;flex-direction:column;gap:2px\">\n          <sc-for list=\"{{ insights }}\" as=\"i\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid var(--line)\">\n              <span style=\"font-size:12px;font-weight:700;color:var(--tx3)\">{{ i.no }}<\u002Fspan>\n              <p style=\"margin:0;font-size:13.5px;line-height:1.6;text-wrap:pretty\">{{ i.txt }}<\u002Fp>\n              <span style=\"font-size:19px;font-weight:750;letter-spacing:-.5px;white-space:nowrap;{{ i.sx }}\">{{ i.val }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"s-tax\" style=\"border:1px solid var(--line);border-radius:var(--r);padding:22px 24px 24px;margin-bottom:16px\">\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px\">\n          <h2 style=\"margin:0;font-size:16px;font-weight:700;letter-spacing:-.3px\">한국 투자자 세금 구조<\u002Fh2>\n          <span style=\"font-size:11px;color:var(--tx3);border:1px solid var(--line2);padding:3px 9px;border-radius:20px\">데이터 갱신과 무관한 정적 문서<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"max-width:900px;padding-top:16px\">\n          <div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(0,1.3fr) minmax(0,1.3fr);gap:0;font-size:12.5px\">\n            <div style=\"padding:9px 12px;font-size:10.5px;font-weight:700;letter-spacing:.6px;color:var(--tx3);border-bottom:1px solid var(--line2)\">구분<\u002Fdiv>\n            <div style=\"padding:9px 12px;font-size:10.5px;font-weight:700;letter-spacing:.6px;color:var(--tx3);border-bottom:1px solid var(--line2)\">미국 직상장<\u002Fdiv>\n            <div style=\"padding:9px 12px;font-size:10.5px;font-weight:700;letter-spacing:.6px;color:var(--tx3);border-bottom:1px solid var(--line2)\">국내 상장<\u002Fdiv>\n            <sc-for list=\"{{ tax }}\" as=\"t\" hint-placeholder-count=\"7\">\n              <div style=\"padding:11px 12px;color:var(--tx2);border-bottom:1px solid var(--line)\">{{ t.k }}<\u002Fdiv>\n              <div style=\"padding:11px 12px;border-bottom:1px solid var(--line);line-height:1.55\">{{ t.us }}<\u002Fdiv>\n              <div style=\"padding:11px 12px;border-bottom:1px solid var(--line);line-height:1.55\">{{ t.kr }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin:16px 0 0;font-size:12px;line-height:1.65;color:var(--tx2);text-wrap:pretty\">실무 판단 기준: 분배금이 크고 매매를 거의 하지 않는다면 국내 상장의 배당소득세 부담이 누적됩니다. 반대로 총수익 중 주가 상승 몫이 크다면 미국 직상장의 양도세 250만원 기본공제가 유리합니다. 연금·ISA 계좌에는 미국 직상장 종목을 편입할 수 없습니다.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsection>\n\n    <section id=\"pane-portfolio\" data-screen-label=\"포트폴리오\" hidden=\"{{ hidePortfolio }}\">\n      <header style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:22px\">\n        <div style=\"max-width:760px\">\n          <div style=\"font-size:11.5px;font-weight:700;letter-spacing:1.3px;color:var(--tx3);padding-bottom:8px\">내 포트폴리오<\u002Fdiv>\n          <h1 style=\"margin:0;font-size:29px;line-height:1.24;font-weight:750;letter-spacing:-.7px;text-wrap:pretty\">언제 얼마가 들어오는가보다,<br>그 금액이 늘고 있는가를 먼저 봅니다.<\u002Fh1>\n          <p style=\"margin:11px 0 0;font-size:13px;color:var(--tx2)\">계좌 유형별 세후 기준 · 보유 내역은 이 브라우저에만 저장됩니다<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fheader>\n\n      <div hidden=\"{{ hideAlert }}\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:15px 18px;margin-bottom:20px;background:var(--alertbg);border:1px solid var(--alertln);border-radius:var(--r)\">\n        <span style=\"display:inline-flex;align-items:center;padding:5px 11px;background:var(--warn);color:var(--onacc);border-radius:20px;font-size:12px;font-weight:800;letter-spacing:-.1px;white-space:nowrap\">{{ erosionBadge }}<\u002Fspan>\n        <div style=\"flex:1 1 320px;min-width:0;font-size:13px;line-height:1.55;color:var(--tx);text-wrap:pretty\">{{ erosionTxt }}<\u002Fdiv>\n        <a href=\"#s-div\" style=\"font-size:12.5px;font-weight:700;padding:7px 13px;border:1px solid var(--alertln);border-radius:var(--r2);color:var(--tx)\">판정표 보기<\u002Fa>\n      <\u002Fdiv>\n\n      <div id=\"pfcash\" hidden=\"{{ hideCash }}\" style=\"display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-bottom:16px\">\n\n        <section id=\"s-month\" style=\"background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px 20px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;padding-bottom:18px\">\n            <div>\n              <h2 style=\"margin:0;font-size:18px;font-weight:700;letter-spacing:-.35px\">이번 달 분배금 &amp; 지급 예정일<\u002Fh2>\n              <p style=\"margin:6px 0 0;font-size:12.5px;color:var(--tx2)\">2026년 8월 기준 · 왼쪽 요약은 창을 넓혀도 항상 당월<\u002Fp>\n            <\u002Fdiv>\n            <div id=\"mnseg\" style=\"display:inline-flex;gap:2px;padding:3px;background:var(--surface2);border:1px solid var(--line);border-radius:10px\">\n              <sc-for list=\"{{ mnSeg }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ s.on }}\" style=\"padding:6px 13px;border:0;border-radius:7px;font-size:12px;font-weight:650;cursor:pointer;{{ s.sx }}\">{{ s.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:26px\">\n            <div id=\"mnsum\">\n              <div style=\"font-size:11.5px;font-weight:700;letter-spacing:.6px;color:var(--tx2);padding-bottom:9px\">8월 세후 예상 수령액<\u002Fdiv>\n              <div style=\"display:flex;align-items:baseline;gap:8px\">\n                <div style=\"font-size:42px;line-height:1;font-weight:760;letter-spacing:-1.8px\">{{ mnNet }}<\u002Fdiv>\n                <div style=\"font-size:15px;font-weight:600;color:var(--tx3)\">원<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px 14px;padding-top:12px;font-size:12px;color:var(--tx2)\">\n                <span>세전 {{ mnGross }}원<\u002Fspan>\n                <span style=\"color:var(--line2)\">|<\u002Fspan>\n                <span>{{ acctLabel }} 기준<\u002Fspan>\n                <span style=\"color:var(--line2)\">|<\u002Fspan>\n                <span>총 {{ mnTotal }}건 중 {{ mnDone }}건 완료<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top:18px;padding:14px 16px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r2)\">\n                <div style=\"font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--tx3);padding-bottom:8px\">다음 지급<\u002Fdiv>\n                <div style=\"display:flex;align-items:baseline;gap:10px\">\n                  <span style=\"font-size:26px;font-weight:750;letter-spacing:-.9px;color:var(--acc)\">D-{{ mnDday }}<\u002Fspan>\n                  <span style=\"font-size:13.5px;font-weight:650\">{{ mnNextT }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--tx2);padding-top:6px\">{{ mnNextDate }} · 세후 {{ mnNextAmt }}원<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:9px;margin-top:12px;padding:11px 14px;border:1px dashed var(--line2);border-radius:var(--r2)\">\n                <span style=\"font-size:12px;color:var(--tx3);font-weight:700\">i<\u002Fspan>\n                <div style=\"font-size:11.5px;line-height:1.6;color:var(--tx2);text-wrap:pretty\">기준일은 8월이지만 입금이 9월로 넘어가는 건이 <strong style=\"color:var(--tx);font-weight:700\">1건<\u002Fstrong> 있습니다. 국내 월말 기준일 종목은 다음 달 초에 들어옵니다.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"display:grid;grid-template-columns:96px minmax(0,1fr) 128px;gap:0;padding:0 0 8px;font-size:10.5px;font-weight:700;letter-spacing:.6px;color:var(--tx3);border-bottom:1px solid var(--line2)\">\n                <span style=\"padding-left:2px\">지급 예상일<\u002Fspan>\n                <span>종목 · 분배기준일<\u002Fspan>\n                <span style=\"text-align:right\">예상 수령액<\u002Fspan>\n              <\u002Fdiv>\n              <div id=\"mnlist\">\n                <sc-for list=\"{{ mnRows }}\" as=\"m\" hint-placeholder-count=\"6\">\n                  <div style=\"display:grid;grid-template-columns:96px minmax(0,1fr) 128px;align-items:center;gap:0;padding:11px 0;border-bottom:1px solid var(--line);{{ m.sx }}\">\n                    <div>\n                      <div style=\"font-size:13px;font-weight:700;letter-spacing:-.2px\">{{ m.day }}<\u002Fdiv>\n                      <div style=\"display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;letter-spacing:.3px;color:var(--tx3);border:1px solid var(--line2);padding:1px 5px;border-radius:3px;margin-top:3px\">{{ m.tag }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"min-width:0;padding-right:10px\">\n                      <div style=\"display:flex;align-items:center;gap:7px\">\n                        <span style=\"width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:{{ m.color }}\"><\u002Fspan>\n                        <span style=\"font-size:13px;font-weight:650\">{{ m.t }}<\u002Fspan>\n                        <span style=\"font-size:11px;color:var(--tx3)\">{{ m.approx }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"font-size:11px;color:var(--tx3);padding-top:2px\">분배기준일 {{ m.basis }} · {{ m.name }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"text-align:right\">\n                      <div style=\"font-size:13.5px;font-weight:700;letter-spacing:-.2px\">{{ m.net }}<\u002Fdiv>\n                      <div style=\"font-size:10.5px;color:var(--tx3);padding-top:2px\">세전 {{ m.gross }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div id=\"mnnote\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-top:12px;font-size:11px;color:var(--tx3)\">\n                <span style=\"display:inline-flex;align-items:center;gap:6px\"><span style=\"font-weight:700;letter-spacing:.3px;border:1px solid var(--line2);padding:1px 5px;border-radius:3px\">추정<\u002Fspan> 기준일 + 영업일 3일 가정 · 공휴일 미반영<\u002Fspan>\n                <span style=\"display:inline-flex;align-items:center;gap:6px\"><span style=\"font-weight:700;color:var(--warn)\">≈<\u002Fspan> 출처 간 25% 이상 불일치 → 관행 규칙 대체값<\u002Fspan>\n                <span style=\"opacity:.55\">흐린 행 = 이미 지급 완료<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"s-div\" style=\"background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px 20px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;padding-bottom:18px\">\n            <div>\n              <div style=\"display:flex;align-items:center;gap:9px\">\n                <h2 style=\"margin:0;font-size:18px;font-weight:700;letter-spacing:-.35px\">분배금 추세<\u002Fh2>\n                <span style=\"font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--onacc);background:var(--acc);padding:2px 7px;border-radius:4px\">핵심<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin:6px 0 0;font-size:12.5px;color:var(--tx2)\">늘고 있나, 줄고 있나 — 보유 수량이 아니라 주당 금액으로 판정<\u002Fp>\n            <\u002Fdiv>\n            <div id=\"dvseg\" style=\"display:inline-flex;gap:2px;padding:3px;background:var(--surface2);border:1px solid var(--line);border-radius:10px\">\n              <sc-for list=\"{{ dvSeg }}\" as=\"s\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ s.on }}\" style=\"padding:6px 13px;border:0;border-radius:7px;font-size:12px;font-weight:650;cursor:pointer;{{ s.sx }}\">{{ s.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div id=\"dvsum\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;padding:18px 20px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r2)\">\n            <div>\n              <p style=\"margin:0;font-size:15px;line-height:1.62;text-wrap:pretty\">보유 포트폴리오의 주당 분배금은 1년 전 대비 <strong style=\"font-size:19px;font-weight:760;letter-spacing:-.4px;{{ dvDeltaSx }}\">{{ dvDelta }}<\u002Fstrong> — <strong style=\"font-weight:750\">{{ dvVerdict }}<\u002Fstrong><\u002Fp>\n              <div style=\"font-size:11.5px;color:var(--tx3);padding-top:8px\">평가금액 가중 · TTM 12개월 이동합 기준<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:7px;padding-top:14px\">\n                <sc-for list=\"{{ dvFlags }}\" as=\"f\" hint-placeholder-count=\"2\">\n                  <span style=\"display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700;{{ f.sx }}\">{{ f.label }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;padding-left:24px;border-left:1px solid var(--line)\">\n              <div>\n                <div style=\"font-size:11px;color:var(--tx3);padding-bottom:4px\">연 예상 수령액<\u002Fdiv>\n                <div style=\"font-size:22px;font-weight:750;letter-spacing:-.7px\">{{ dvAnnual }}<span style=\"font-size:12px;font-weight:600;color:var(--tx3);padding-left:3px\">원<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:11px;color:var(--tx3);padding-bottom:4px\">월 평균<\u002Fdiv>\n                <div style=\"font-size:22px;font-weight:750;letter-spacing:-.7px\">{{ dvMonthly }}<span style=\"font-size:12px;font-weight:600;color:var(--tx3);padding-left:3px\">원<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:11px;color:var(--tx3)\">{{ acctLabel }} 세후<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div id=\"dvchart\" style=\"padding-top:18px\">\n            <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px\">\n              <div style=\"font-size:12.5px;font-weight:700\">{{ dvChartTitle }}<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:var(--tx3)\">{{ dvChartHint }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:relative;height:300px\"><canvas id=\"cp2\"><\u002Fcanvas><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div hidden=\"{{ hideDvMonth }}\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding-top:16px\">\n            <div style=\"padding:13px 15px;border:1px solid var(--line);border-radius:var(--r2)\">\n              <div style=\"font-size:11px;color:var(--tx3);padding-bottom:5px\">가장 많이 들어오는 달<\u002Fdiv>\n              <div style=\"font-size:17px;font-weight:750;letter-spacing:-.4px\">12월 · 412,800원<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:13px 15px;border:1px solid var(--line);border-radius:var(--r2)\">\n              <div style=\"font-size:11px;color:var(--tx3);padding-bottom:5px\">가장 적게 들어오는 달<\u002Fdiv>\n              <div style=\"font-size:17px;font-weight:750;letter-spacing:-.4px\">2월 · 168,400원<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:13px 15px;border:1px solid var(--line);border-radius:var(--r2)\">\n              <div style=\"font-size:11px;color:var(--tx3);padding-bottom:5px\">편차 배수<\u002Fdiv>\n              <div style=\"font-size:17px;font-weight:750;letter-spacing:-.4px\">2.45배<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div id=\"dvtbl\" hidden=\"{{ hideDvTbl }}\" style=\"padding-top:20px\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:10px\">\n              <div style=\"font-size:12.5px;font-weight:700\">종목별 판정<\u002Fdiv>\n              <div style=\"font-size:11px;color:var(--tx3)\">전년 동기 대비 TTM 주당분배금 ±8% 기준<\u002Fdiv>\n            <\u002Fdiv>\n            <div id=\"dvwrap\" style=\"overflow-x:auto\">\n              <div style=\"min-width:760px\">\n                <div style=\"display:grid;grid-template-columns:minmax(150px,1.2fr) 150px 104px 112px 96px 128px;align-items:end;gap:0;padding-bottom:9px;border-bottom:1px solid var(--line2);font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--tx3)\">\n                  <span>종목<\u002Fspan>\n                  <span>최근 회차 · TTM 주당분배금<\u002Fspan>\n                  <span style=\"text-align:right\">3개월 전 대비<\u002Fspan>\n                  <span style=\"text-align:right\">전년 동기 대비<\u002Fspan>\n                  <span style=\"text-align:right\">주가 1년<\u002Fspan>\n                  <span style=\"text-align:right\">판정<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ dvRows }}\" as=\"d\" hint-placeholder-count=\"6\">\n                  <div style=\"display:grid;grid-template-columns:minmax(150px,1.2fr) 150px 104px 112px 96px 128px;align-items:center;gap:0;padding:12px 0;border-bottom:1px solid var(--line);{{ d.rowSx }}\">\n                    <div style=\"display:flex;align-items:center;gap:9px;min-width:0;padding-left:8px\">\n                      <span style=\"width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:{{ d.color }}\"><\u002Fspan>\n                      <div style=\"min-width:0\">\n                        <div style=\"font-size:13px;font-weight:700\">{{ d.t }}<\u002Fdiv>\n                        <div style=\"font-size:10.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px\">{{ d.name }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div>\n                      <div style=\"font-size:12.5px;font-weight:650\">{{ d.dps }}<\u002Fdiv>\n                      <div style=\"font-size:10.5px;color:var(--tx3);padding-top:2px\">{{ d.last }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"text-align:right;font-size:12.5px;font-weight:600;{{ d.q3Sx }}\">{{ d.q3 }}<\u002Fdiv>\n                    <div style=\"text-align:right;font-size:14px;font-weight:700;{{ d.yoySx }}\">{{ d.yoy }}<\u002Fdiv>\n                    <div style=\"text-align:right;font-size:12.5px;font-weight:600;{{ d.pxSx }}\">{{ d.px }}<\u002Fdiv>\n                    <div style=\"text-align:right;padding-right:8px\">\n                      <span style=\"display:inline-flex;align-items:center;gap:6px;{{ d.badgeSx }}\">{{ d.badge }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div id=\"np2\" style=\"display:flex;flex-wrap:wrap;gap:8px 18px;padding-top:14px;font-size:11px;color:var(--tx3)\">\n              <span style=\"display:inline-flex;align-items:center;gap:6px\"><span style=\"display:inline-flex;padding:3px 9px;background:var(--warn);color:var(--onacc);border-radius:20px;font-size:11px;font-weight:800\">원금 잠식<\u002Fspan> 분배금은 유지인데 주가가 −8% 이하 — 통장만 보면 이상이 없어 보이는 구간<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:5px\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--pos)\"><\u002Fspan>증액 ≥ +8%<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:5px\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--tx3)\"><\u002Fspan>횡보 −8~+8%<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:5px\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--neg)\"><\u002Fspan>감액 ≤ −8%<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u00
